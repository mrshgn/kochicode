<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kochicode | Coming Soon</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- CSS STYLES --- */
        
        :root {
            --bg-color: #0a0a0c;
            --text-main: #ffffff;
            --text-muted: #888890;
            --accent: #3b82f6; /* Sleek electric blue */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle background glow effect */
        .background-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            /* Will be animated by JS */
            transition: transform 0.1s ease-out; 
        }

        /* Small badge */
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            margin-bottom: 2rem;
            background: rgba(59, 130, 246, 0.05);
        }

        /* Main Logo */
        .logo {
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 1.5rem;
        }

        .logo .accent {
            color: var(--accent);
            animation: blink 1s step-end infinite;
        }

        /* Subtitle */
        .subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 3rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Loading dots */
        .loader {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            opacity: 0.4;
            animation: pulse 1.5s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* Animations */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(1); opacity: 0.4; }
            40% { transform: scale(1.5); opacity: 1; }
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .background-glow {
                width: 80vw;
                height: 80vw;
            }
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>
    
    <main class="container" id="parallax-container">
        <!-- The style attribute adds a staggered delay to the animations -->
        <div class="badge fade-in-up" style="animation-delay: 0.2s;">Coming Soon</div>
        
        <h1 class="logo fade-in-up" style="animation-delay: 0.4s;">
            kochicode<span class="accent">_</span>
        </h1>
        
        <p class="subtitle fade-in-up" style="animation-delay: 0.6s;">
            We are crafting something extraordinary.<br>Stay tuned for the launch.
        </p>
        
        <div class="loader fade-in-up" style="animation-delay: 0.8s;">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </main>

    <script>
        /* --- JAVASCRIPT --- */
        
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("parallax-container");
            
            // Subtle mouse parallax effect
            document.addEventListener("mousemove", (e) => {
                // Get the center of the window
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                
                // Apply the transformation to the container
                container.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
            });

            // Reset position if mouse leaves window
            document.addEventListener("mouseleave", () => {
                container.style.transform = `translate(0px, 0px)`;
            });
        });
    </script>
</body>
</html>
